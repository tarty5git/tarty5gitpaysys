app:
  name: "CTH Job High-Throughput International Payment Platform"
  auth:
    provider: "DB" # Configurable to "LDAP" or "DB"
    ldap:
      url: "ldap://localhost:389"
      base-dn: "dc=cth,dc=com"
      user-dn-pattern: "uid={0},ou=users"
  mfa:
    enabled: false # Toggle switch for SMS / Email OTP

spring:
  application:
    name: payment-platform
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER_CLASS_NAME:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: ${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.dialect.H2Dialect}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

payment:
  gateway:
    stripe:
      enabled: true
      poolSize: 3
      api-key: "sk_test_stripe_sample_key"
    paypal:
      enabled: true
      poolSize: 2
      client-id: "paypal_client_id"
      client-secret: "paypal_client_secret"
    klarna:
      enabled: false
    razorpay:
      enabled: true
      poolSize: 4
      key-id: "rzp_test_123"
      key-secret: "rzp_secret_456"
